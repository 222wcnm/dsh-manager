<!DOCTYPE html>
<!--
================================================================================
DSH Manager · 会话状态感知 3 版方案全景走查台 (Gallery Workbench)
================================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whalekeeper · 会话状态感知设计全景走查台（V1 / V2 / V3）</title>
<script src="dsh-assets-library.js"></script>
<style>
:root {
  color-scheme: light;
  --dsw-static-neutral-bluish-00: rgb(255, 255, 255);
  --dsw-static-neutral-bluish-50: rgb(249, 250, 251);
  --dsw-static-neutral-bluish-60: rgb(245, 246, 247);
  --dsw-static-neutral-bluish-100: rgb(235, 238, 242);
  --dsw-static-neutral-bluish-400: rgb(173, 178, 184);
  --dsw-static-neutral-bluish-700: rgb(97, 102, 107);
  --dsw-static-neutral-bluish-1000: rgb(15, 17, 21);
  --dsw-static-deepseek-450: rgb(86, 134, 254);
  --dsw-static-deepseek-500: rgb(65, 118, 230);
  --dsw-static-green-500: rgb(34, 197, 94);
  --dsw-static-amber-500: rgb(245, 158, 11);
  --dsw-static-red-50: rgb(254, 242, 242);
  --dsw-static-red-600: rgb(236, 19, 19);

  --dsw-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
  --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-alias-border-l3: rgba(0, 0, 0, 0.14);
  --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-label-caption: var(--dsw-static-neutral-bluish-400);
  --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
  --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.1);
  --dsw-alias-button-primary-fill: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-button-primary-hover: rgb(67, 69, 74);
  --dsw-alias-label-primary-foreground: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-60);
  --dsw-alias-state-business-primary: var(--dsw-static-deepseek-500);
  --dsw-alias-state-success-primary: var(--dsw-static-green-500);
  --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);

  --dsh-mgr-sem-working: var(--dsw-static-deepseek-450);
  --dsh-mgr-sem-waiting: var(--dsw-static-amber-500);
  --dsh-mgr-sem-completed: var(--dsw-static-green-500);

  --page-bg: #eef1f5;
  --page-card: #ffffff;
  --page-text: #0f1115;
  --page-muted: #61666b;
  --page-border: rgba(0,0,0,.08);
}

body[data-ds-dark-theme],
[data-theme="dark-preview"] {
  color-scheme: dark;
  --dsw-alias-bg-base: rgb(22, 23, 26);
  --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
  --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
  --dsw-alias-border-l3: rgba(255, 255, 255, 0.18);
  --dsw-alias-label-primary: rgb(241, 243, 245);
  --dsw-alias-label-secondary: rgb(173, 178, 184);
  --dsw-alias-label-caption: rgb(97, 102, 107);
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
  --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.14);
  --dsw-alias-button-primary-fill: rgb(241, 243, 245);
  --dsw-alias-button-primary-hover: rgb(215, 219, 224);
  --dsw-alias-label-primary-foreground: rgb(15, 17, 21);
  --dsw-alias-bg-module-platform: rgb(30, 32, 37);
  --dsw-alias-state-business-primary: rgb(86, 134, 254);

  --page-bg: #101216;
  --page-card: #181a20;
  --page-text: #f1f3f5;
  --page-muted: #9aa0a6;
  --page-border: rgba(255,255,255,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page-bg);
  color: var(--page-text);
  font-family: var(--dsw-font-family);
  padding: 24px 32px 80px;
  transition: background .2s ease;
}

.top-bar {
  max-width: 1300px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.page-title { display: flex; align-items: center; gap: 10px; }
.page-title h1 { font-size: 20px; font-weight: 600; }
.toggles { display: flex; gap: 8px; }
.theme-btn {
  height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--page-border);
  background: var(--page-card); color: var(--page-text); font-size: 12px; font-weight: 500; cursor: pointer;
}

.gallery-grid {
  max-width: 1300px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 20px;
  align-items: start;
}

.gallery-card {
  background: var(--page-card);
  border: 1px solid var(--page-border);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.03);
}
.g-head { display: flex; align-items: center; justify-content: space-between; }
.g-tag { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 7px; border-radius: 6px; }
.g-tag.v1 { background: #0f1115; }
[data-theme="dark-preview"] .g-tag.v1 { background: #5686fe; }
.g-tag.v2 { background: var(--dsw-static-amber-500); }
.g-tag.v3 { background: var(--dsw-static-green-500); }

.g-desc { font-size: 12px; color: var(--page-muted); line-height: 1.5; }
.frame-holder {
  display: flex;
  justify-content: center;
  background: var(--dsw-alias-bg-module-platform);
  padding: 14px 0;
  border-radius: 12px;
  border: 1px dashed var(--page-border);
}

.iframe-sim {
  width: 360px;
  height: 270px;
  border: none;
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(15,17,21,.10);
  background: var(--dsw-alias-bg-base);
}
</style>
</head>
<body>

  <header class="top-bar">
    <div class="page-title">
      <h1>Whalekeeper · 会话状态感知 3 版方案全景走查台</h1>
    </div>
    <div class="toggles">
      <button class="theme-btn" onclick="toggleGlobalTheme()">🌓 切换全场深浅外观</button>
    </div>
  </header>

  <main class="gallery-grid">
    <!-- V1 方案 -->
    <article class="gallery-card">
      <div class="g-head">
        <span class="g-tag v1">方案 1 · 原生轻量流</span>
        <a href="preview-v1.html" style="font-size:12px;color:var(--dsw-alias-state-business-primary);text-decoration:none;font-weight:600">全屏独立走查 &rarr;</a>
      </div>
      <p class="g-desc">
        <b>极简无框平铺 + 官方 StateMatrix 点阵 + L-Line 树形几何导轨</b>。已完成/已停止灰度降噪，悬停滑出「✓ 已读」药丸。
      </p>
      <div class="frame-holder">
        <iframe class="iframe-sim" src="preview-v1.html"></iframe>
      </div>
    </article>

    <!-- V2 方案 -->
    <article class="gallery-card">
      <div class="g-head">
        <span class="g-tag v2">方案 2 · 微卡片仪表盘</span>
        <a href="preview-v2.html" style="font-size:12px;color:var(--dsw-alias-state-business-primary);text-decoration:none;font-weight:600">全屏独立走查 &rarr;</a>
      </div>
      <p class="g-desc">
        <b>模块化微卡片 + 子任务守护坞 (Dock)</b>。待确认左侧高亮金黄重音条，并发子任务作为 Mini Chips 挂载。
      </p>
      <div class="frame-holder">
        <iframe class="iframe-sim" src="preview-v2.html"></iframe>
      </div>
    </article>

    <!-- V3 方案 -->
    <article class="gallery-card">
      <div class="g-head">
        <span class="g-tag v3">方案 3 · 分诊矩阵与折叠流</span>
        <a href="preview-v3.html" style="font-size:12px;color:var(--dsw-alias-state-business-primary);text-decoration:none;font-weight:600">全屏独立走查 &rarr;</a>
      </div>
      <p class="g-desc">
        <b>顶部状态分诊选择器 + 可折叠流水线抽屉</b>。多会话高并发场景下一键过滤待确认/运行中/已完成。
      </p>
      <div class="frame-holder">
        <iframe class="iframe-sim" src="preview-v3.html"></iframe>
      </div>
    </article>
  </main>

  <script>
let isDark = false;
function toggleGlobalTheme() {
  isDark = !isDark;
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark-preview');
    document.body.setAttribute('data-ds-dark-theme', 'true');
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.body.removeAttribute('data-ds-dark-theme');
  }
  document.querySelectorAll('iframe').forEach(f => {
    try {
      if (f.contentWindow && f.contentWindow.toggleGlobalTheme) {
        if (f.contentWindow.isDark !== isDark) f.contentWindow.toggleGlobalTheme();
      }
    } catch(e) {}
  });
}
if (isDark) toggleGlobalTheme();
  </script>
</body>
</html>
