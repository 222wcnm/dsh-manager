<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef0f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;padding:32px;display:flex;gap:48px;align-items:flex-start}
.stage{display:flex;flex-direction:column;gap:14px;align-items:center}
.stage-tag{font-size:12px;color:#81858c}
.panel{width:320px;background:#fff;border-radius:16px;padding:16px 14px 12px;box-shadow:0 12px 32px rgba(15,17,21,.10),0 0 1px rgba(15,17,21,.10)}
/* 应用栏 */
.appbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.brand .whale{width:20px;height:20px;color:#0f1115;flex:none}
.brand .name{font-size:15px;font-weight:600;letter-spacing:.2px;color:#0f1115;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tag{font-size:11px;font-weight:500;color:#adb2b8;background:#f5f6f7;border-radius:999px;padding:2px 8px;border:1px solid rgba(0,0,0,.05)}
.iconbtn{width:28px;height:28px;border:none;border-radius:50%;background:none;color:#61666b;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{background:rgba(38,49,72,.06);color:#0f1115}
.iconbtn svg{display:block}
/* 状态卡 */
.statuscard{background:#f5f6f7;border:1px solid rgba(15,17,21,.05);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.statuscard .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dot{position:relative;display:inline-block;width:10px;height:10px;color:#22c55e;flex:none}
.dot:before{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;opacity:.1}
.dot:after{content:"";position:absolute;top:20%;right:20%;bottom:20%;left:20%;border-radius:50%;background:currentColor}
.state-word{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#0f1115}
.port{font-size:12px;font-weight:500;color:#4176e6;font-variant-numeric:tabular-nums}
.statuscard .row2{margin-top:4px;font-size:11.5px;color:#81858c;font-variant-numeric:tabular-nums}
/* 操作 */
.ops{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.oprow{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;flex:1;height:32px;padding:6px 12px;border-radius:12px;border:1px solid transparent;font-family:inherit;font-size:13px;font-weight:400;line-height:20px;cursor:pointer;color:#0f1115;transition:background .1s cubic-bezier(.4,0,.2,1),transform .1s cubic-bezier(.4,0,.2,1)}
.btn:active{transform:scale(.96)}
.btn.primary{background:#0f1115;color:#fff;font-weight:500}
.btn.primary:hover{background:#43454a}
.btn.outline{background:#fff;border-color:rgba(0,0,0,.1)}
.btn.outline:hover{background:rgba(38,49,72,.06)}
.btn.danger{background:#fff;border-color:rgba(0,0,0,.1);color:#ec1313}
.btn.danger:hover{background:rgba(236,19,19,.05)}
.btn.ghost{background:#f5f6f7;border-color:rgba(15,17,21,.05);color:#4176e6;font-weight:500}
.btn.ghost:hover{background:#ebeef2}
/* 底栏 */
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid rgba(0,0,0,.05);padding-top:10px;margin-top:2px}
.foot .hint{font-size:11px;color:#adb2b8}
.link{font-size:12px;color:#4176e6;background:none;border:none;font-family:inherit;cursor:pointer;padding:2px 6px;border-radius:6px}
.link:hover{background:rgba(38,49,72,.06)}
/* 设置面板（分组） */
.settings{border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:12px;margin-bottom:12px}
.s-title{font-size:14px;font-weight:500;color:#0f1115;margin-bottom:10px}
.s-group{font-size:11px;font-weight:500;color:#81858c;margin:12px 0 6px;letter-spacing:.3px}
.s-group:first-of-type{margin-top:0}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.field:last-child{margin-bottom:0}
.field .fl{font-size:12px;color:#61666b}
.field input[type=number],.field input[type=text]{width:120px;height:28px;padding:4px 8px;border:1px solid rgba(0,0,0,.1);border-radius:6px;background:#fff;color:#0f1115;font-family:inherit;font-size:12px}
.field.check{justify-content:space-between}
.checkbox{width:16px;height:16px;accent-color:#4176e6}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.theme-cube{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 10px;border:1px solid rgba(0,0,0,.1);border-radius:16px;background:none;color:#0f1115;font-family:inherit;font-size:12px;cursor:pointer}
.theme-cube svg{flex:none}
.theme-cube.selected{background:#f5f6f7;border-color:#adb2b8;font-weight:500}
.s-actions{display:flex;gap:8px;margin-top:4px}
</style>
</head>
