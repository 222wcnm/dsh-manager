<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH Web UI 官方图标资产高精度视觉走查</title>
<script src="dsh-assets-library.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f7;
  --card: #ffffff;
  --text: #0f1115;
  --border: rgba(0,0,0,0.08);
  --blue: #5686fe;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16171a;
  --card: #1e2025;
  --text: #f1f3f5;
  --border: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: 30px;
}
h1 { font-size: 18px; margin-bottom: 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.icon-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.icon-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
  word-break: break-all;
  text-align: center;
}
.scales {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
.item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #81858c;
}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <h1>DSH Web UI 官方提取资产 1:1 独立走查看板</h1>
  <button onclick="document.body.toggleAttribute('data-theme')" style="padding:6px 12px;cursor:pointer;border-radius:6px;border:1px solid var(--border)">切换暗色</button>
</div>

<div class="grid" id="container"></div>

<script>
const container = document.getElementById('container');
Object.keys(DSH_ASSETS).forEach(name => {
  const div = document.createElement('div');
  div.className = 'icon-box';
  div.innerHTML = `
    <div class="icon-title">${name}</div>
    <div class="scales">
      <div class="item">${renderDSHIcon(name, 16)}<span>16px</span></div>
      <div class="item">${renderDSHIcon(name, 24)}<span>24px</span></div>
      <div class="item">${renderDSHIcon(name, 32)}<span>32px</span></div>
      <div class="item">${renderDSHIcon(name, 48)}<span>48px</span></div>
    </div>
  `;
  container.appendChild(div);
});
</script>
</body>
</html>
