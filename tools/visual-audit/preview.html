    </div>

    <!-- URL 行（running / external 时显示） -->
    <div id="url-row" class="url-row hidden">
      <span id="url-text" class="url-text"></span>
      <span id="uptime-text" class="uptime-text"></span>
    </div>

    <!-- 主操作行 -->
    <div class="btn-row">
      <button id="btn-start" class="btn primary"><span class="spinner" aria-hidden="true"></span><span class="btn-label">启动</span></button>
      <button id="btn-stop" class="btn danger"><span class="spinner" aria-hidden="true"></span><span class="btn-label">停止</span></button>
      <button id="btn-restart" class="btn outline"><span class="spinner" aria-hidden="true"></span><span class="btn-label">重启</span></button>
    </div>

    <!-- 次操作行：接管（仅 external 显示）+ 打开 Web UI -->
    <div class="btn-row">
      <button id="btn-adopt" class="btn primary hidden"><span class="spinner" aria-hidden="true"></span><span class="btn-label">接管</span></button>
      <button id="btn-open" class="btn link wide">打开 Web UI</button>
    </div>

    <!-- 操作进度（点击后乐观反馈） -->
    <div id="progress" class="progress hidden" aria-live="polite">
      <div class="progress-bar"><div class="progress-bar-fill"></div></div>
      <div id="progress-text" class="progress-text"></div>
    </div>

    <!-- 状态明细 -->
    <div id="detail-line" class="detail">状态：—</div>

    <!-- 错误面板 -->
    <div id="error-panel" class="error hidden">
      <div id="error-text" class="error-text"></div>
      <button id="btn-copy-log" class="btn outline small hidden">复制日志</button>
    </div>

    <!-- 操作结果 toast -->
    <div id="toast" class="toast toast-hidden" role="status" aria-live="polite">
      <span id="toast-text"></span>
    </div>

    <!-- 底部提示 -->
    <div id="hint" class="hint">安装 dsh-lifecycle 插件可优雅停机</div>

    <!-- 设置面板（内嵌展开视图） -->
    <div id="settings-panel" class="settings hidden">
      <div class="settings-title">设置</div>
      <label class="field">
        <span class="field-label">端口</span>
        <input id="set-port" type="number" min="1" max="65535" step="1" value="3080">
      </label>
      <label class="field">
        <span class="field-label">Profile</span>
        <input id="set-profile" type="text" spellcheck="false" value="web">
      </label>
      <label class="field check">
        <span class="field-label">自动打开 Web UI</span>
        <input id="set-autoopen" type="checkbox">
      </label>
      <label class="field">
        <span class="field-label">徽标刷新间隔（秒）</span>
        <input id="set-badge" type="number" min="30" max="3600" step="1" value="30">
      </label>
      <div id="settings-error" class="settings-error hidden"></div>
      <div class="settings-actions">
        <button id="btn-save" class="btn primary">保存</button>
        <button id="btn-cancel" class="btn outline">取消</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 预览桩：模拟 chrome.* API（仅 _preview.html 用） =====
    const st = location.hash.replace('#', '') || 'stopped';
    const results = {
      stopped: { ok: true, result: { state: 'stopped', source: null, pid: null, port: null, url: null, version: 'unknown', startedAt: null, health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      running: { ok: true, result: { state: 'running', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now() - 62 * 60 * 1000, health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      external: { ok: true, result: { state: 'external', source: 'external', pid: 54321, port: 4080, url: 'http://127.0.0.1:4080', version: 'unknown', startedAt: null, externalCount: 1, health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      starting: { ok: true, result: { state: 'starting', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now(), health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      'busy-restart': { ok: true, result: { state: 'starting', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now(), health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      'busy-stop': { ok: true, result: { state: 'running', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now(), health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      toast: { ok: true, result: { state: 'running', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now() - 62 * 60 * 1000, health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      'm2-health': { ok: true, result: { state: 'running', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now() - 62 * 60 * 1000, lifecycle: true, health: { ok: true, pid: 12345, uptimeMs: 754 * 1000, port: 3080, nodeVersion: 'v22.16.0' }, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      'm2-noplugin': { ok: true, result: { state: 'running', source: 'managed', pid: 12345, port: 3080, url: 'http://127.0.0.1:3080', version: '0.1.0-rc.6', startedAt: Date.now() - 62 * 60 * 1000, lifecycle: false, health: null, logFile: 'C:\\dsh-manager\\logs\\dsh-web.log' } },
      error: { ok: false, result: null, error: { code: 'PORT_BUSY', message: '端口 3080 已被其他程序占用', logTail: 'dsh web: http://127.0.0.1:3080\nError: listen EADDRINUSE' } },
    };
    window.chrome = {
      storage: {
        local: {
          get: (obj, cb) => cb({ settings: { port: 3080, profile: 'web', autoOpen: true, badgeInterval: 30 } }),
          set: (obj, cb) => cb && cb(),
        },
      },
      runtime: {
        sendMessage: (msg) => Promise.resolve(results[st] || results.stopped),
      },
      tabs: { create: () => {} },
    };
  </script>
  <script src="../../extension/popup.js"></script>
  <script>
    // 设置面板状态：hash 带 settings 前缀时打开
    if (st.startsWith('settings')) {
      setTimeout(() => {
        const p = document.getElementById('settings-panel');
        if (p) p.classList.remove('hidden');
      }, 100);
    }
    // 动效/点击反馈快照（popup.js 顶层 let 为全局词法绑定，可直接覆写）：
    // busy-restart = 重启进行中（阶段：新进程启动中），busy-stop = 停止进行中，toast = 完成确认
    if (st === 'busy-restart' || st === 'busy-stop') {
      setTimeout(() => {
        state = st === 'busy-restart' ? 'starting' : 'stopping';
        pending = { action: st === 'busy-restart' ? 'restart' : 'stop', phase: st === 'busy-restart' ? 'starting' : 'stopping', atMs: Date.now() - 9000, ack: false };
        render();
      }, 200);
    }
    if (st === 'toast') {
      setTimeout(() => {
        showToast('重启完成，dsh web 已就绪', 'success');
      }, 200);
    }
  </script>
</body>
</html>
